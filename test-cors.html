<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test CORS FCM</title>
</head>
<body>
  <h1>Test CORS FCM</h1>
  <button id="testBtn">Kirim request ke endpoint</button>
  <pre id="result">Belum ada hasil</pre>
  <script>
    document.getElementById('testBtn').addEventListener('click', async () => {
      const resultEl = document.getElementById('result');
      try {
        const response = await fetch('https://clusterguard.onrender.com/send-fcm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tokens: [],
            title: 'Test CORS',
            body: 'CORS OK'
          })
        });
        const text = await response.text();
        resultEl.textContent = `status=${response.status}\n${text}`;
      } catch (error) {
        resultEl.textContent = error.message;
      }
    });
  </script>
</body>
</html>
